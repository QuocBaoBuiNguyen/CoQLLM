name: sigllm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy<2.0
  # PyTorch & CUDA - Using newer PyTorch for LLM/PEFT compatibility
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip:
    # Core requirements from requirements.txt
    - omegaconf==2.3.0
    - scikit-learn
    - webdataset
    - timm
    - transformers
    - peft
    
    # Crucial for LLM/LoRA (inferred from code & common setups)
    - accelerate
    - bitsandbytes
    - sentence-transformers
    - wandb
    - tqdm
    - pyyaml
    - pandas
    - opencv-python  # Often needed by timm/vision parts
    - scipy
