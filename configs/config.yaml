model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  llama_model: "/content/open_llama_3b"
  prompt_path: "/content/SigLLM/prompts/prompts/qformer_prompt_movie.txt"
  prompt_template: "{}"
  
  freeze_rec: True
  freeze_proj: True
  freeze_lora: False
  
  max_txt_len: 1024
  end_sym: "###"
  ans_type: "v2"
  
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 10
  
  rec_model: "MF"
  user_num: -100
  item_num: -100

  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05

  qformer_config:
    use_qformer: True
    qformer_ckpt: "/content/SigLLM/ckpt/qformer_stage1/qformer_stage1_best.pth" # Path from stage 1
    qformer_d_model: 768
    num_queries: 8
    num_heads: 8
    num_layers: 2

  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: "/content/mf/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth"

  ckpt: /content/

datasets:
  movie_ood:
    path: "/content/SigLLM/data/processed/ml-1m/"
    data_type: default
    build_info:
      storage: "/content/SigLLM/data/processed/ml-1m/"

run:
  task: rec_pretrain
  output_dir: "/content/open_llama_3b_finetune_log"
  device: "cuda"
  seed: 42
  
  # Optimization
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-3
  min_lr: 8e-5
  warmup_lr: 1e-5
  weight_decay: 1e-3
  amp: True
  
  # Training Schedule
  max_epoch: 200
  iters_per_epoch: 50
  batch_size_train: 16
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 200
  
  # Workflow
  evaluate: False
  mode: "v2"
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "valid"]
  resume_ckpt_path: null

  # Distributed
  distributed: True
  world_size: 1
  dist_url: "env://"